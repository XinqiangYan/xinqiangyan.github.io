{{/* Decorative illustration for products without a photo. Param: "array" | "birdcage" | "shim" | "animal" | "flex" */}}
{{ $kind := . | default "array" }}
<svg class="coil-art" viewBox="0 0 400 260" role="img" aria-label="Illustration" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ca-bg-{{ $kind }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1628"/><stop offset="1" stop-color="#12345a"/></linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#ca-bg-{{ $kind }})"/>
  <g fill="none" stroke="#38d6c6" stroke-width="2.2" opacity=".95">
  {{ if eq $kind "birdcage" }}
    <ellipse cx="200" cy="70" rx="110" ry="26"/><ellipse cx="200" cy="190" rx="110" ry="26"/>
    {{ range seq 0 11 }}{{ $x := add 90 (mul . 20) }}<line x1="{{ $x }}" y1="{{ add 70 (cond (or (lt . 2) (gt . 9)) 10 24) }}" x2="{{ $x }}" y2="{{ add 190 (cond (or (lt . 2) (gt . 9)) 10 24) }}" opacity="{{ cond (or (lt . 3) (gt . 8)) ".45" ".9" }}"/>{{ end }}
  {{ else if eq $kind "shim" }}
    {{ range seq 0 3 }}{{ $y := add 50 (mul . 45) }}
      {{ range seq 0 3 }}{{ $x := add 70 (mul . 70) }}<rect x="{{ $x }}" y="{{ $y }}" width="54" height="34" rx="8"/><rect x="{{ add $x 8 }}" y="{{ add $y 7 }}" width="38" height="20" rx="5" stroke="#f5b83d" opacity=".8"/>{{ end }}
    {{ end }}
  {{ else if eq $kind "animal" }}
    <rect x="40" y="95" width="320" height="70" rx="35"/><rect x="60" y="108" width="280" height="44" rx="22" opacity=".45"/>
    {{ range seq 0 7 }}<line x1="{{ add 90 (mul . 32) }}" y1="95" x2="{{ add 90 (mul . 32) }}" y2="165" opacity=".7"/>{{ end }}
    <circle cx="330" cy="130" r="12" stroke="#f5b83d"/>
  {{ else if eq $kind "flex" }}
    <path d="M30 170 Q200 90 370 170" opacity=".4"/>
    {{ range seq 0 5 }}<circle cx="{{ add 70 (mul . 52) }}" cy="{{ add 120 (mul (sub . 2.5 | math.Abs) 14) }}" r="34"/>{{ end }}
    {{ range seq 0 4 }}<circle cx="{{ add 96 (mul . 52) }}" cy="{{ add 178 (mul (sub . 2 | math.Abs) 12) }}" r="34" opacity=".55"/>{{ end }}
  {{ else }}
    {{ range $r := seq 0 2 }}{{ $y := add 70 (mul $r 60) }}{{ range seq 0 4 }}<circle cx="{{ add 90 (mul . 55) (mul (mod $r 2) 27) }}" cy="{{ $y }}" r="38" opacity="{{ cond (eq (mod . 2) 0) "1" ".6" }}"/>{{ end }}{{ end }}
  {{ end }}
  </g>
  <g stroke="#ffffff" stroke-opacity=".06">{{ range seq 0 20 }}<line x1="{{ mul . 20 }}" y1="0" x2="{{ mul . 20 }}" y2="260"/>{{ end }}</g>
</svg>
