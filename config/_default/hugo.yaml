# Site configuration — see README.md for how to edit content.
title: Yan Lab
baseURL: 'https://xinqiangyan.github.io/'
languageCode: en-us
defaultContentLanguage: en

enableRobotsTXT: true
enableEmoji: true
summaryLength: 30
disableKinds: [taxonomy, term]

pagination:
  pagerSize: 12

outputs:
  home: [HTML, RSS]
  section: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true

imaging:
  resampleFilter: lanczos
  quality: 82
  anchor: smart

params:
  description: >-
    Yan Lab at Vanderbilt University Medical Center develops and commercializes
    advanced MRI RF coils, B0 shimming hardware and MRI-guided therapy technology.
  tagline: MRI RF engineering · from the bench to the scanner
  org: Vanderbilt University Medical Center · VUIIS
  email: xinqiang.yan@vumc.org
  # Address inquiries to this mailbox for product quotes (change if you set up a sales address).
  sales_email: xinqiang.yan@vumc.org
  address:
    - Vanderbilt University Institute of Imaging Science (VUIIS)
    - 1161 21st Ave S, MCN D2205
    - Nashville, TN 37232, USA
  google_scholar: https://scholar.google.com/citations?user=nd0XQKwAAAAJ
  logo: media/lablogo.jpg
  # Browser-tab icon (antenna). PNG is used for Safari/iOS; SVG for modern browsers. Falls back to the logo if missing.
  favicon: media/favicon.png
  favicon_svg: media/favicon.svg
  hero_image: media/soldering.jpg
  team_image: media/coders.jpg

menus:
  main:
    - name: Research
      url: /research/
      weight: 10
    - name: Products
      url: /products/
      weight: 20
    - name: Publications
      url: /publications/
      weight: 30
    - name: People
      url: /people/
      weight: 40
    - name: News
      url: /news/
      weight: 50
    - name: Contact
      url: /contact/
      weight: 60
